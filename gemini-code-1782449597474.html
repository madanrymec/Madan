<script>
// ===================== Helpers =====================
const fmtINR = (v) => {
  if (!v || isNaN(v)) return '0';
  const abs = Math.abs(v);
  if (abs >= 1e7) return (v/1e7).toFixed(2) + ' Cr';
  if (abs >= 1e5) return (v/1e5).toFixed(2) + ' L';
  if (abs >= 1e3) return (v/1e3).toFixed(1) + ' K';
  return parseFloat(v).toFixed(0);
};
const fmtINRFull = (v) => '\u20B9' + Math.round(v || 0).toLocaleString('en-IN');
const fmtNum = (v) => Math.round(v || 0).toLocaleString('en-IN');
const fmtPct = (v, d=1) => (!v || isNaN(v)) ? '0%' : v.toFixed(d) + '%';

const COPPER_BRIGHT = '#e6985a';
const TEAL = '#3fb8a6';
const TEXT_1 = '#aab8c2';
const TEXT_2 = '#6b7b88';
const LINE = '#2a3744';
const PALETTE = ['#c87d3f','#3fb8a6','#7a9cc6','#e0a83e','#9b7fc4','#5ec98f','#d96a5a','#6b8fae','#c7a76b','#5a8f9c','#a87fae','#8aa86b'];

Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.color = TEXT_1;
Chart.defaults.font.size = 11;

// ===================== Filter state =====================
const state = { month:'', region:'', office:'', product:'', fin_year: '2026-2027' };
let charts = {};

// Helper to build URL query strings from state
function buildQueryString() {
  const params = new URLSearchParams();
  if (state.month) params.append('month', state.month);
  if (state.region) params.append('region', state.region);
  if (state.office) params.append('sales_office', state.office);
  if (state.product) params.append('product', state.product);
  if (state.fin_year) params.append('fin_year', state.fin_year);
  return '?' + params.toString();
}

function updateActiveFilters(){
  const labels = [];
  if(state.month) labels.push('Month: '+state.month);
  if(state.region) labels.push('Region: '+state.region);
  if(state.office) labels.push('Office: '+state.office);
  if(state.product) labels.push('Product: '+state.product);
  
  const el = document.getElementById('activeFilters');
  el.textContent = labels.length ? ('Active • ' + labels.join(' | ')) : '';
}

// ===================== Event Listeners =====================
function initSlicers(){
  document.getElementById('f-month').addEventListener('change', e => { state.month = e.target.value; render(); });
  document.getElementById('f-region').addEventListener('change', e => { state.region = e.target.value; render(); });
  document.getElementById('f-office').addEventListener('change', e => { state.office = e.target.value; render(); });
  document.getElementById('f-product').addEventListener('change', e => { state.product = e.target.value; render(); });
  
  document.getElementById('resetBtn').addEventListener('click', () => {
    state.month = ''; state.region = ''; state.office = ''; state.product = '';
    ['f-month','f-region','f-office','f-product'].forEach(id => document.getElementById(id).value = '');
    render();
  });
}

// ===================== Render Functions =====================
function renderKpiGrid(data) {
  const cards = [
    {label:'Net Revenue', value: '\u20B9'+fmtINR(data.overall_sales), extra: `<div class="delta flat">Gross to net realisation</div>`},
    {label:'Billed Quantity', value: fmtNum(data.billed_quantity), unit:'units', extra:`<div class="delta flat">Total units shipped</div>`},
    {label:'Invoices Raised', value: fmtNum(data.invoices_raised), unit:'docs', extra:`<div class="delta flat">Unique billing docs</div>`},
    {label:'Customers Billed', value: fmtNum(data.customers_billed), unit:'accounts', extra:`<div class="delta flat">Active buyers</div>`}
  ];

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}${c.unit ? `<span class="unit">${c.unit}</span>` : ''}</div>
      ${c.extra}
    </div>
  `).join('');
}

function renderTrendChart(data) {
  const dates = data.map(d => d.month_year);
  const vals = data.map(d => d.total_revenue);
  const total = vals.reduce((a, b) => a + b, 0);
  
  document.getElementById('trendTotalTag').textContent = dates.length ? ('Σ ' + '\u20B9'+fmtINR(total)) : '';

  const ctx = document.getElementById('chartTrend');
  if(charts.trend) charts.trend.destroy();
  charts.trend = new Chart(ctx, {
    type:'line',
    data: {
      labels: dates,
      datasets:[{
        label:'Net Revenue', data: vals,
        borderColor: COPPER_BRIGHT, backgroundColor: 'rgba(200,125,63,0.12)',
        fill:true, tension:0.25, pointRadius:3, borderWidth:2
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false} },
      scales: {
        x: { grid:{color:'#1f2a34'}, ticks:{color:TEXT_2} },
        y: { grid:{color:'#1f2a34'}, ticks:{callback:(v)=>fmtINR(v), color:TEXT_2} }
      }
    }
  });
}

function renderProducts(data) {
  const totalNet = data.reduce((s, e) => s + parseFloat(e.revenue || 0), 0);

  const ctx = document.getElementById('chartProducts');
  if(charts.products) charts.products.destroy();
  charts.products = new Chart(ctx, {
    type:'doughnut',
    data: {
      labels: data.map(d => d.mapped_product),
      datasets: [{
        data: data.map(d => parseFloat(d.revenue)),
        backgroundColor: data.map((_, i) => PALETTE[i % PALETTE.length]),
        borderColor: '#141b22', borderWidth:2
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins: {
        legend: { position:'right', labels:{color:TEXT_1} }
      }
    }
  });

  const tbody = document.querySelector('#productTable tbody');
  const maxNet = data[0] ? parseFloat(data[0].revenue) : 1;
  tbody.innerHTML = data.map(e => `
    <tr>
      <td><div class="rank-bar-bg"><div class="rank-bar" style="width:${(e.revenue/maxNet*100).toFixed(1)}%"></div><div class="name-cell">${e.mapped_product}</div></div></td>
      <td class="num">${fmtINRFull(e.revenue)}</td>
      <td class="num">${fmtNum(e.quantity)}</td>
      <td class="num">${(e.revenue/totalNet*100).toFixed(1)}%</td>
    </tr>
  `).join('') || `<tr><td colspan="4" style="text-align:center;">No data</td></tr>`;
}

function renderLocations(data) {
  // Offices Bar Chart
  const offices = data.offices.slice(0, 12);
  const ctxOffices = document.getElementById('chartOffices');
  if(charts.offices) charts.offices.destroy();
  charts.offices = new Chart(ctxOffices, {
    type:'bar',
    data: {
      labels: offices.map(o => o.Sales_office),
      datasets: [{
        data: offices.map(o => o.revenue),
        backgroundColor: COPPER_BRIGHT, borderRadius:3, barThickness: 16
      }]
    },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
  });

  // Regions Bar Chart
  const regions = data.regions;
  const ctxRegions = document.getElementById('chartRegions');
  if(charts.regions) charts.regions.destroy();
  charts.regions = new Chart(ctxRegions, {
    type:'bar',
    data: {
      labels: regions.map(r => r.Sales_Region_Name),
      datasets: [{
        data: regions.map(r => r.revenue),
        backgroundColor: regions.map((_,i) => PALETTE[i%PALETTE.length]),
        borderRadius:4, barThickness: 38
      }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
  });
}

function renderAop(data) {
  const container = document.getElementById('aopList');
  container.innerHTML = data.map(p => {
    const pct = p.achievement_percentage;
    const cls = pct >= 100 ? 't-good' : (pct >= 50 ? 't-warn' : 't-bad');
    const widthPct = Math.min(pct, 100);
    
    return `
      <div class="aop-row">
        <div>
          <div class="aop-name">${p.product}</div>
          <span class="aop-unit-tag">${p.unit}</span>
        </div>
        <div class="aop-track">
          <div class="aop-fill ${cls}" style="width:${widthPct}%"></div>
        </div>
        <div class="aop-pct ${cls}">${fmtPct(pct, 0)}</div>
        <div class="aop-val">${fmtNum(p.actual)} / ${fmtNum(p.target)}</div>
      </div>
    `;
  }).join('');
}

// ===================== Master Fetch & Render =====================
async function render() {
  updateActiveFilters();
  const query = buildQueryString();

  try {
    const [kpis, trend, products, locations, aop] = await Promise.all([
      fetch('/api/kpis' + query).then(r => r.json()),
      fetch('/api/sales-trend' + query).then(r => r.json()),
      fetch('/api/products-revenue' + query).then(r => r.json()),
      fetch('/api/sales-by-location' + query).then(r => r.json()),
      fetch('/api/aop-achievement' + query).then(r => r.json())
    ]);

    renderKpiGrid(kpis);
    renderTrendChart(trend);
    renderProducts(products);
    renderLocations(locations);
    renderAop(aop);
    
    // (Note: The MoM chart was removed from dynamic rendering since the API returns absolute trend values. 
    // You can adapt the Trend API later if you want strict MoM calculations overlaid).

  } catch (error) {
    console.error("Failed to fetch dashboard data:", error);
  }
}

// ===================== Init =====================
function init(){
  document.getElementById('periodChip').innerHTML = `Period: <b>FY 2026&ndash;27</b>`;
  initSlicers();
  render();
}

init();
</script>
