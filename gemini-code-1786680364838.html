<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Pipeline — Talent Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#151b2c; --navy:#1c2b4a; --canvas:#f3f2ee; --panel:#ffffff; --line:#e2ded3; --line-soft:#ebe8df; --teal:#0f6b5c; --teal-deep:#0a4d42; --teal-tint:#e7f1ee; --amber:#b8862f; --amber-tint:#faf1e0; --plum:#6b4c8a; --plum-tint:#efe9f5; --muted:#767a86; --danger:#a8432f; --danger-tint:#f8e9e5; --slate-tint:#eceef2; --radius:14px; --shadow: 0 1px 2px rgba(20,20,20,0.04), 0 8px 24px -12px rgba(20,20,20,0.12); }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--canvas); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .shell{ max-width:1350px; margin:0 auto; padding:48px 32px 96px; }

  /* Standard Base CSS */
  .masthead{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:28px; padding-bottom:28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal-deep); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .eyebrow::before{ content:""; width:7px;height:7px; background:var(--teal); border-radius:50%; display:inline-block; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:36px; line-height:1.1; margin:0; letter-spacing:-0.01em; color:var(--navy); }
  .back-link{ font-size:12.5px; color:var(--muted); text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; }
  .header-actions { display: flex; gap: 12px; margin-top: 18px; }
  .btn-primary { background: linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px -4px rgba(10,77,66,0.5); }
  .btn-outline { background: transparent; color: var(--navy); border: 1px solid var(--line); padding: 10px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .jobcode-select label{ font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#565b68; display:block; margin-bottom:8px; }
  select#jobCodeFilter{ width:100%; font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:9px; padding:12px 32px 12px 14px; }
  
  .stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:28px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .stat .n{ font-family:'Fraunces', serif; font-size:28px; color:var(--navy); font-weight:500; line-height:1; margin-bottom:6px; }
  .stat .l{ font-size:11.5px; color:var(--muted); }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{ padding:20px 26px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .panel-title{ font-family:'Fraunces', serif; font-weight:500; font-size:19px; color:var(--navy); }
  .legend{ display:flex; gap:14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  
  /* Table CSS */
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:1000px; }
  thead th{ text-align:left; font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#767a86; padding:12px 18px; border-bottom:1px solid var(--line-soft); background:#fbfaf7; white-space:nowrap; }
  thead th.stage-col{ text-align:center; }
  tbody td{ padding:16px 18px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#fbfaf8; }
  td.stage-col{ text-align:center; }
  .job-group-row { background-color: #eef2f5; cursor: pointer; transition: background-color 0.2s; }
  .job-group-row:hover { background-color: #e0e6eb; }
  .job-group-title { font-family:'JetBrains Mono', monospace; font-weight:600; color:var(--navy); font-size: 14px; }
  .toggle-icon { display: inline-block; width: 20px; font-size: 14px; color: var(--teal-deep); transition: transform 0.3s ease; margin-right: 8px; }
  .toggle-icon.open { transform: rotate(90deg); }
  .empty-row { text-align: center; color: var(--muted); padding: 24px !important; font-style: italic; background-color: #fafafa; }
  .candidate-name{ font-weight:600; color:var(--ink); }
  .btn-ghost{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--teal-deep); background:var(--teal-tint); border:1px solid rgba(15,107,92,0.18); padding:7px 12px; border-radius:8px; cursor:pointer; }
  .badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:5px 10px; border-radius:20px; white-space:nowrap; }
  .badge::before{ content:""; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .badge.not-scheduled{ background:var(--slate-tint); color:#565b68; } .badge.not-scheduled::before{ background:#9aa0ac; }
  .badge.scheduled{ background:var(--amber-tint); color:var(--amber); } .badge.scheduled::before{ background:var(--amber); }
  .badge.completed{ background:var(--teal-tint); color:var(--teal-deep); } .badge.completed::before{ background:var(--teal); }
  .badge.selected{ background:#e4f2e9; color:#256b3f; } .badge.selected::before{ background:#2f9e5c; }
  .badge.hold{ background:var(--amber-tint); color:var(--amber); } .badge.hold::before{ background:var(--amber); }
  .badge.rejected{ background:var(--danger-tint); color:var(--danger); } .badge.rejected::before{ background:var(--danger); }
  .badge.pending{ background:var(--plum-tint); color:var(--plum); } .badge.pending::before{ background:var(--plum); }
  .stage-cell{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .stage-date{ font-size:10.5px; color:var(--muted); }
  .stage-interviewer{ font-size:11px; color:#40454f; }
  .feedback-btn{ background:var(--navy); color:#fff; border:none; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .feedback-btn.secondary{ background:transparent; color:var(--navy); border:1px solid var(--line); }
  
  /* Select Inputs */
  .table-select { font-family: 'Inter', sans-serif; font-size: 11.5px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #fff; width: 100%; max-width: 135px; outline: none; cursor: pointer; }
  
  /* Modals */
  .modal-overlay{ position:fixed; inset:0; background:rgba(21,27,44,0.55); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--panel); border-radius:16px; max-width:640px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 24px 60px -12px rgba(0,0,0,0.35); }
  .modal.wide{ max-width:820px; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 26px; border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:var(--panel); z-index:2; }
  .modal-title{ font-family:'Fraunces', serif; font-size:20px; color:var(--navy); font-weight:500; }
  .stage-pill{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:3px 9px; border-radius:6px; margin-left:10px; vertical-align:middle; }
  .stage-pill.hr{ background:var(--plum-tint); color:var(--plum); }
  .stage-pill.tech{ background:var(--teal-tint); color:var(--teal-deep); }
  .modal-close{ border:none; background:var(--slate-tint); width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-body{ padding:22px 26px 28px; }
  .pdf-frame{ width:100%; height:70vh; border:1px solid var(--line); border-radius:10px; background:#f3f2ee; }

  /* New Detailed Form Styling */
  .fb-section-title { font-size: 14px; font-weight: 700; color: #0f172a; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }
  .fb-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
  .fb-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .fb-form-label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .fb-form-control { width: 100%; padding: 9px 12px; font-size: 13.5px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-family: inherit; }
  .fb-form-control:focus { border-color: #148060; box-shadow: 0 0 0 3px rgba(20, 128, 96, 0.12); }
  
  .comp-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .comp-title { font-size: 13.5px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }

  .fb-rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .fb-rec-card { padding: 12px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background-color: #f8fafc; color: #334155; font-size: 12.5px; font-weight: 600; text-align: center; cursor: pointer; user-select: none; }
  .fb-rec-card.selected { background-color: #e6f4f1; border-color: #148060; color: #0f5f47; box-shadow: 0 0 0 2px rgba(20, 128, 96, 0.2); }

  /* Read Only View Layout */
  .ro-row { margin-bottom: 12px; }
  .ro-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .ro-val { font-size: 13.5px; color: #0f172a; font-weight: 500; background: #f8fafc; padding: 8px 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
</style>
</head>
<body>
<div class="shell">

  <a href="/" class="back-link">&larr; Back to requisition form</a>

  <div class="masthead">
    <div>
      <div class="eyebrow">Talent Operations • Candidate Pipeline</div>
      <h1>Resumes &amp; Interview Tracking</h1>
      <div class="header-actions">
          <button class="btn-primary" onclick="openAddCandidateModal()">+ Add Candidate</button>
      </div>
    </div>
    <div class="jobcode-select">
      <label>Filter by Job Code</label>
      <select id="jobCodeFilter"></select>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Applicants</div>
    </div>
    <div class="table-scroll">
      <table id="pipelineTable">
      <thead>
        <tr>
          <th>Candidate</th>
          <th>Source</th>
          <th>Applied</th>
          <th>Resume</th>
          <th class="stage-col">HR Interview</th>
          <th class="stage-col">Technical Interview</th>
          <th class="stage-col">Final Outcome</th>
        </tr>
      </thead>
      <tbody id="candidateRows"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- Add Candidate Modal -->
<div class="modal-overlay" id="addCandidateOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Add Candidate Manually</div>
      <button class="modal-close" onclick="closeModal('addCandidateOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <form id="addCandidateForm">
        <div class="ff-field" style="margin-bottom:12px;">
            <label class="fb-form-label">Select Job ID / Role</label>
            <select id="manualJobCode" class="fb-form-control" required></select>
        </div>
        <div class="ff-field" style="margin-bottom:12px;">
            <label class="fb-form-label">Candidate Full Name</label>
            <input type="text" id="manualCandidateName" class="fb-form-control" placeholder="e.g. Madan" required>
        </div>
        <div class="ff-field" style="margin-bottom:12px;">
            <label class="fb-form-label">Upload Resume (PDF only)</label>
            <input type="file" id="manualResume" class="fb-form-control" accept="application/pdf" required>
        </div>
         <div class="ff-field" style="margin-bottom:12px;">
            <label class="fb-form-label">Candidate Source</label>
            <select id="manualSource" class="fb-form-control" required>
                <option value="" disabled selected>Select source...</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Naukri">Naukri</option>
                <option value="Indeed">Indeed</option>
                <option value="Referral">Referral</option>
            </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
            <button type="button" class="btn-outline" onclick="closeModal('addCandidateOverlay')">Cancel</button>
            <button type="submit" class="btn-primary">Save Candidate</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- PDF Modal -->
<div class="modal-overlay" id="pdfOverlay">
  <div class="modal wide">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="pdfModalName">Resume</div>
        <div class="modal-sub" id="pdfModalSub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('pdfOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <iframe class="pdf-frame" id="pdfFrame" src=""></iframe>
    </div>
  </div>
</div>

<!-- Feedback & Schedule Modal (Now WIDE to handle massive form) -->
<div class="modal-overlay" id="fbOverlay">
  <div class="modal wide">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="fbModalTitle">Interview Feedback</div>
        <div style="font-size:12.5px; color:var(--muted); margin-top:4px;" id="fbModalSub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('fbOverlay')">✕</button>
    </div>
    <div class="modal-body" id="fbModalBody"></div>
  </div>
</div>

<script>
/* ---------------- Application State ---------------- */
let candidates = [];
const STAGES = ['hr', 'tech'];
const stageLabel = { hr: 'HR', tech: 'Technical' };
const statusMeta = { "not-scheduled": { label: "Not Scheduled", cls: "not-scheduled" }, "scheduled": { label: "Scheduled", cls: "scheduled" }, "completed": { label: "Completed", cls: "completed" } };
const recMeta = { advance: { label: "Strongly Recommend", cls: "selected" }, recommend: { label: "Recommend", cls: "selected" }, hold: { label: "Hold", cls: "hold" }, reject: { label: "Do Not Recommend", cls: "rejected" } };

const CORE_COMPETENCIES = [
    "Functional / Technical Competence", "Problem Solving & Analytical Ability", "Communication Skills", 
    "Accountability & Ownership", "Team Work & Collaboration", "Adaptability & Drive for Excellence", "People Leadership"
];

const RATING_OPTIONS = `
    <option value="">Select Rating...</option>
    <option value="1">1 - Significantly below expectations</option>
    <option value="2">2 - Below expectations</option>
    <option value="3">3 - Meets expectations</option>
    <option value="4">4 - Exceeds expectations</option>
    <option value="5">5 - Significantly exceeds expectations</option>
    <option value="NA">Not Assessed</option>
    <option value="NP">Not Applicable</option>
`;

/* ---------------- API Fetching ---------------- */
async function loadCandidates() {
    try {
        const response = await fetch('/api/candidates');
        candidates = await response.json();
        populateJobCodeDropdown();
        renderTable();
    } catch (error) { console.error("Error loading candidates:", error); }
}

function populateJobCodeDropdown() {
    const uniqueJobs = Array.from(new Map(candidates.map(c => [c.jobCode, c])).values());
    const sel = document.getElementById('manualJobCode');
    sel.innerHTML = '<option value="" disabled selected>Select Job to link candidate...</option>' + uniqueJobs.map(j => `<option value="${j.jobCode}">${j.jobCode} - ${j.role} (${j.location})</option>`).join('');
    
    const filterSel = document.getElementById('jobCodeFilter');
    const currentVal = filterSel.value;
    filterSel.innerHTML = '<option value="all">All Job Codes</option>' + uniqueJobs.map(j => `<option value="${j.jobCode}">${j.jobCode}</option>`).join('');
    if (currentVal && filterSel.querySelector(`option[value="${currentVal}"]`)) filterSel.value = currentVal;
    
    filterSel.removeEventListener('change', renderTable);
    filterSel.addEventListener('change', renderTable);
}

function currentFilter(){ return document.getElementById('jobCodeFilter').value || 'all'; }

/* ---------------- Helper Functions ---------------- */
function getCandidateById(id) {
    for (const job of candidates) {
        const found = job.candidates.find(x => x.id === id);
        if (found) return found;
    }
    return null;
}

function finalOutcome(c){
  const hrDone = c.hr.status === 'completed' && c.hr.feedback;
  const techDone = c.tech.status === 'completed' && c.tech.feedback;
  if(hrDone && c.hr.feedback.recommendation === 'reject') return { label: 'Rejected', cls: 'rejected' };
  if(techDone && c.tech.feedback.recommendation === 'reject') return { label: 'Rejected', cls: 'rejected' };
  if(hrDone && techDone){
    const both = [c.hr.feedback.recommendation, c.tech.feedback.recommendation];
    if(both.includes('hold')) return { label: 'On Hold', cls: 'hold' };
    return { label: 'Selected', cls: 'selected' };
  }
  if(hrDone || techDone) return { label: 'In Progress', cls: 'pending' };
  return { label: 'Pending', cls: 'pending' };
}

function stageCellHtml(c, stage){
  if (stage === 'tech' && c.hr && c.hr.status === 'completed' && c.hr.feedback && c.hr.feedback.recommendation === 'reject') {
    return `<div class="stage-cell" style="opacity: 0.5; pointer-events: none;"><span class="badge rejected">Not Eligible</span><div class="stage-interviewer"><span class="muted" style="color: #a8432f; font-weight: 600;">Rejected in HR</span></div></div>`;
  }

  const s = c[stage] || {status: 'not-scheduled'};
  const sMeta = statusMeta[s.status] || statusMeta['not-scheduled'];
  let html = `<div class="stage-cell"><span class="badge ${sMeta.cls}">${sMeta.label}</span>`;
  if(s.status === 'scheduled' && s.interviewDate) {
    const dt = new Date(s.interviewDate);
    html += `<div class="stage-date">${dt.toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})}</div>`;
  }
  html += `<div class="stage-interviewer">${s.interviewer || '<span class="muted">Unassigned</span>'}</div>`;
  
  if(s.feedback){
    html += `<button class="feedback-btn secondary" onclick="openFeedback(${c.id}, '${stage}')">View feedback</button>`;
  } else if(s.status === 'not-scheduled') {
    html += `<button class="feedback-btn secondary" onclick="openFeedback(${c.id}, '${stage}')">Schedule &amp; add feedback</button>`;
  } else {
    html += `<button class="feedback-btn" onclick="openFeedback(${c.id}, '${stage}')">Add feedback</button>`;
  }
  return html + `</div>`;
}

function toggleGroup(jobCode) {
    const childRows = document.querySelectorAll(`.child-of-${jobCode}`);
    const icon = document.getElementById(`icon-${jobCode}`);
    let isCurrentlyHidden = (childRows.length > 0 && childRows[0].style.display === 'none');
    childRows.forEach(row => row.style.display = isCurrentlyHidden ? 'table-row' : 'none');
    if (icon) isCurrentlyHidden ? icon.classList.add('open') : icon.classList.remove('open');
}

/* ---------------- Main Form Generators ---------------- */

function openFeedback(id, stage){
  const c = getCandidateById(id);
  if (!c) return;

  const s = c[stage] || {};
  const pillHtml = `<span class="stage-pill ${stage}">${stageLabel[stage]}</span>`;
  document.getElementById('fbModalTitle').innerHTML = (s.feedback ? 'Interview Feedback' : 'Schedule / Add Feedback') + pillHtml;
  document.getElementById('fbModalSub').textContent = `${c.name} • ${c.jobCode}`;

  const body = document.getElementById('fbModalBody');

  if(s.feedback){
      renderReadOnlyView(c, stage, s.feedback, body);
  } else {
      renderEditableForm(c, stage, {}, body);
  }
  document.getElementById('fbOverlay').classList.add('open');
}

function editFeedback(id, stage){
  const c = getCandidateById(id);
  if(c) renderEditableForm(c, stage, c[stage].feedback || {}, document.getElementById('fbModalBody'));
}

/* ---------------- READ ONLY VIEW ---------------- */
function renderReadOnlyView(c, stage, fb, container) {
    const d = fb.details || {};
    const rMeta = recMeta[fb.recommendation] || { label: fb.recommendation, cls: '' };

    let html = `<div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
                  <button class="btn-primary" onclick="editFeedback(${c.id}, '${stage}')">Edit Feedback</button>
                </div>`;

    html += `<div class="fb-section-title">Section 1: Candidate & Interview Info</div>
             <div class="fb-row-3">
               <div class="ro-row"><div class="ro-label">Round Name</div><div class="ro-val">${fb.round || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Interviewer Name</div><div class="ro-val">${fb.interviewer || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Interview Date</div><div class="ro-val">${fb.date || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Present Org & Desig</div><div class="ro-val">${d.presentOrg || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Total Experience</div><div class="ro-val">${d.totalExp || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Notice Period</div><div class="ro-val">${d.noticePeriod || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Current CTC</div><div class="ro-val">${d.currentCtc || '-'}</div></div>
               <div class="ro-row"><div class="ro-label">Expected CTC</div><div class="ro-val">${d.expectedCtc || '-'}</div></div>
             </div>`;

    html += `<div class="fb-section-title">Section 2: Core Competencies</div>`;
    if(d.competencies && d.competencies.length){
        d.competencies.forEach(comp => {
            html += `<div class="comp-card">
                       <div class="comp-title">${comp.name}</div>
                       <div class="ro-row"><div class="ro-label">Rating</div><div class="ro-val">${comp.rating || 'Not Assessed'}</div></div>
                       <div class="ro-row"><div class="ro-label">Evidence / Notes</div><div class="ro-val">${comp.notes || '-'}</div></div>

    html += `<div class="fb-section-title">Section 3: Role-Specific Traits</div>`;
    let traitsFound = false;

                html += `<div class="comp-card">

    if(!traitsFound) html += `<p class="muted">No role-specific traits added.</p>`;

    html += `<div class="fb-section-title">Section 4: Summary</div>
             <div class="ro-row"><div class="ro-label">Red Flags / Concerns</div><div class="ro-val">${d.redFlags || '-'}</div></div>
             <div class="ro-row"><div class="ro-label">Other Observations</div><div class="ro-val">${d.observations || '-'}</div></div>

                <div class="ro-label" style="color:#0f5f47;">FINAL RECOMMENDATION</div>

    container.innerHTML = html;
}

      <div>

        <div><label class="fb-form-label">Total Experience</label><input type="text" id="fbExp" class="fb-form-control" value="${d.totalExp || ''}"></div>

    <div class="fb-row-3">

    container.innerHTML = html;
}

function selectRecommendation(cardElem, recValue) {
  const allCards = cardElem.parentElement.querySelectorAll('.fb-rec-card');
  allCards.forEach(c => c.classList.remove('selected'));
  cardElem.classList.add('selected');
  document.getElementById('fbRec').value = recValue;
}

/* ---------------- Save to Backend ---------------- */
async function saveFeedbackData(candidateId, stage) {
  const c = getCandidateById(candidateId);
  if (!c) return;

  const action = document.getElementById('fbAction').value;
  const interviewDate = document.getElementById('fbDate').value;
  const interviewer = document.getElementById('fbInterviewer')?.value || 'Unassigned';

  if (!c[stage]) c[stage] = {};

  try {
    if (action === 'schedule') {
      const response = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ candidate_id: candidateId, stage: stage, date: interviewDate, interviewer: interviewer })
      });
      const result = await response.json();
      if (result.status === 'success') {
          alert("Schedule saved.");
          closeModal('fbOverlay');
          loadCandidates();
      }
    } else {
      // Gather Core Competencies
      const comps = CORE_COMPETENCIES.map((name, i) => ({
          name: name,
          rating: document.getElementById(`compRating_${i}`).value,
          notes: document.getElementById(`compNotes_${i}`).value
      }));

      // Gather Role Traits
      const rTraits = [];
      for(let i=0; i<5; i++){
          rTraits.push({
              name: document.getElementById(`traitName_${i}`).value,
              rating: document.getElementById(`traitRating_${i}`).value,
              notes: document.getElementById(`traitNotes_${i}`).value
          });
      }

      // Build Details JSON Object
      const detailsObj = {
          presentOrg: document.getElementById('fbOrg').value,
          totalExp: document.getElementById('fbExp').value,
          currentCtc: document.getElementById('fbCurCtc').value,
          expectedCtc: document.getElementById('fbExpCtc').value,
          noticePeriod: document.getElementById('fbNotice').value,
          competencies: comps,
          roleTraits: rTraits,
          redFlags: document.getElementById('fbRedFlags').value,
          observations: document.getElementById('fbObservations').value,
          fitment: document.getElementById('fbFitment').value
      };

      const payload = {
        candidate_id: candidateId,
        stage: stage,
        feedback: {
          date: interviewDate.split('T')[0] || new Date().toISOString().split('T')[0],
          round: document.getElementById('fbRound').value,
          interviewer: interviewer,
          recommendation: document.getElementById('fbRec').value,
          details: detailsObj
        }
      };

      const response = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      if (result.status === 'success') {
          alert("Detailed Feedback saved successfully.");
          closeModal('fbOverlay');
          loadCandidates();
      }
    }
  } catch (error) {
    console.error("Database save error:", error);
    alert("Network or server error while trying to save details.");
  }
}

/* ---------------- Utilities & Render Table ---------------- */
async function saveTableSource(candId) {
    const selectElem = document.getElementById(`source-select-${candId}`);
    if (!selectElem) return;
    try {
        await fetch('/api/update_source', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ candidate_id: candId, source: selectElem.value })
        });
    } catch (error) { console.error("Failed to update source:", error); }
}

function openResume(id){
  const c = getCandidateById(id);
  if (!c || !c.resumeFile || c.resumeFile === 'None') return alert("No resume file uploaded for this candidate.");
  document.getElementById('pdfModalName').textContent = `${c.name} — Resume`;
  document.getElementById('pdfModalSub').textContent = `${c.role} • ${c.jobCode}`;
  document.getElementById('pdfFrame').src = c.resumeFile;
  document.getElementById('pdfOverlay').classList.add('open');
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id === 'pdfOverlay') document.getElementById('pdfFrame').src = '';
}
document.querySelectorAll('.modal-overlay').forEach(ov => { ov.addEventListener('click', (e) => { if(e.target === ov) closeModal(ov.id); }); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(ov => closeModal(ov.id)); });

function renderTable() {
  let html = "";
  const filter = currentFilter();
  const filteredJobs = candidates.filter(job => filter === 'all' || job.jobCode === filter);

  filteredJobs.forEach(job => {
      const candCount = job.candidates.length;
      html += `<tr class="job-group-row" onclick="toggleGroup('${job.jobCode}')"><td colspan="7"><div style="display:flex; justify-content:space-between; align-items:center;"><div><span class="toggle-icon" id="icon-${job.jobCode}">▶</span><span class="job-group-title">Job ID: ${job.jobCode}</span><span class="job-group-meta">Role: ${job.role} | Location: ${job.location}</span></div><div style="font-size:12.5px; font-weight:600; color:var(--navy);">${candCount} Applicant(s)</div></div></td></tr>`;
      
      if (candCount === 0) {
          html += `<tr class="child-of-${job.jobCode}" style="display:none;"><td colspan="7" class="empty-row">No applicants yet. Click "+ Add Candidate".</td></tr>`;
      } else {
          job.candidates.forEach(c => {
              const outcome = finalOutcome(c);
              const appliedStr = c.appliedOn ? new Date(c.appliedOn).toLocaleDateString([], {dateStyle:'medium'}) : '—';
              let baseSource = c.source || 'Manual Entry';

              html += `<tr class="child-of-${job.jobCode}" style="display:none;">
                <td><div class="candidate-name">${c.name}</div></td>
                <td>
                  <select id="source-select-${c.id}" class="table-select" onchange="saveTableSource(${c.id})">
                    <option value="Manual Entry" ${baseSource === 'Manual Entry' ? 'selected' : ''}>Manual Entry</option>
                    <option value="LinkedIn" ${baseSource === 'LinkedIn' ? 'selected' : ''}>LinkedIn</option>
                    <option value="Naukri" ${baseSource === 'Naukri' ? 'selected' : ''}>Naukri</option>
                    <option value="Indeed" ${baseSource === 'Indeed' ? 'selected' : ''}>Indeed</option>
                    <option value="Referral" ${baseSource === 'Referral' ? 'selected' : ''}>Referral</option>
                  </select>
                </td>
                <td><span class="applied-date">${appliedStr}</span></td>
                <td><button class="btn-ghost" onclick="openResume(${c.id})">View PDF</button></td>
                <td class="stage-col">${stageCellHtml(c, 'hr')}</td>
                <td class="stage-col">${stageCellHtml(c, 'tech')}</td>
                <td class="final-outcome"><span class="badge ${outcome.cls}">${outcome.label}</span></td>
              </tr>`;
          });
      }
  });
  document.getElementById('candidateRows').innerHTML = html;
}

document.addEventListener("DOMContentLoaded", () => { loadCandidates(); });
